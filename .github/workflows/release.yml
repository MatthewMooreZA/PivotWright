name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build --configuration Release
      - run: dotnet run --configuration Release --no-build --project tests/PivotWright.Tests
      - run: dotnet pack src/PivotWright/PivotWright.csproj --configuration Release --no-build --output nupkg
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: nupkg/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Must match the environment name in the nuget.org trusted publishing policy.
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: nupkg
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # Exchanges the GitHub OIDC token for a short-lived nuget.org API key.
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - run: dotnet nuget push "nupkg/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
